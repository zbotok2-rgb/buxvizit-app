plugins {
    id 'com.android.application'
}

android {
    namespace "com.yourapp.buxvizit"
    compileSdk 34

    defaultConfig {
        applicationId "com.yourapp.buxvizit"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
